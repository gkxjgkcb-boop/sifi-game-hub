name: Build SIFO GAME HUB for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name SIFO-GAME-HUB run_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SIFO-GAME-HUB-Windows
          path: dist/SIFO-GAME-HUB/
